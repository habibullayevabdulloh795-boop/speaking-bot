<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Mock Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            margin-top: 50px;
        }
        h2 { color: #38bdf8; }
        .btn {
            background-color: #eab308;
            color: #000;
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Speaking Mock Imtihoniga Xush Kelibsiz!</h2>
        <p>Part 1.1: What do you usually do in your free time?</p>
        <button class="btn" onclick="startSpeaking()">🎤 Gapirishni Boshlash</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function startSpeaking() {
            alert("Mikrofon ulandi! Tez orada ovozni tahlil qilish qo'shiladi.");
        }
    </script>
</body>
</html>
